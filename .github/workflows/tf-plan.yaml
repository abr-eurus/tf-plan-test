name: Terraform Plan & Apply

on:
  push:
    branches: [main]
  #   paths:
  #     - 'terraform/**'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - 'terraform/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  id-token: write   # needed if you use OIDC to assume a cloud role

env:
  TF_WORKING_DIR: infra
  TF_VERSION: "1.15.8"

jobs:
  # -----------------------------------------------------------------
  # 1. PLAN — runs on every push/PR, no approval needed
  # -----------------------------------------------------------------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      plan-outcome: ${{ steps.plan.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform plan -input=false -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json
        continue-on-error: false

      - name: Download Plan Visualizer binary
        run: |
          curl -L -o terraform-plan-visualizer \
            https://github.com/cloudvic-org/terraform-plan-visualizer/releases/download/v1.0.1/terraform-plan-visualizer-linux-amd64
          chmod +x terraform-plan-visualizer

      - name: Generate Plan Visualization
        run: ./terraform-plan-visualizer -i ${{ env.TF_WORKING_DIR }}/plan.json -o plan-visualization.html

      - name: Upload plan file (for apply job)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/plan.tfplan
          retention-days: 5
      
      - name: Set visualization path
        id: viz-path
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "path=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=run-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare visualization for Pages
        run: |
          mkdir -p pages-out
          cp plan-visualization.html pages-out/plan-visualization.html

      - name: Publish visualization to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: main
          publish_dir: pages-out
          destination_dir: ${{ steps.viz-path.outputs.path }}
          keep_files: true

      # - name: Upload plan visualization
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: plan-visualization
      #     path: plan-visualization.html
      #     retention-days: 5

      - name: Comment plan summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pagesUrl = `https://${owner}.github.io/${repo}/${{ steps.viz-path.outputs.path }}/plan-visualization.html`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner,
              repo,
              body: `🪄 **Terraform plan generated.**\n\nView the interactive visualization here: ${pagesUrl}`
            });

  # -----------------------------------------------------------------
  # 2. APPLY — only runs on main branch pushes, gated by a
  #    GitHub Environment that requires manual approval
  # -----------------------------------------------------------------
  apply:
    name: Terraform Apply
    needs: plan
    # if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production   # <-- configure this environment's "required reviewers" in repo Settings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init -input=false

      - name: Download plan file
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      # - name: Terraform Apply
      #   working-directory: ${{ env.TF_WORKING_DIR }}
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #   run: terraform apply -input=false -auto-approve plan.tfplan