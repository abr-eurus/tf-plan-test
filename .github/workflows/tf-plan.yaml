name: Terraform Plan & Apply

on:
  push:
    branches: [main]
  #   paths:
  #     - 'terraform/**'
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - 'terraform/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  id-token: write   # needed if you use OIDC to assume a cloud role

env:
  TF_WORKING_DIR: infra
  TF_VERSION: "1.15.8"

jobs:
  # -----------------------------------------------------------------
  # 1. PLAN — runs on every push/PR, no approval needed
  # -----------------------------------------------------------------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      plan-outcome: ${{ steps.plan.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          terraform plan -input=false -out=plan.tfplan
          terraform show -json plan.tfplan > plan.json
        continue-on-error: false

      # ---------------------------------------------------------------
      # Generate a human-readable HTML visualization of the plan
      # https://github.com/cloudvic-org/terraform-plan-visualizer
      # ---------------------------------------------------------------
      - name: Generate Plan Visualization
        uses: cloudvic-org/terraform-plan-visualizer@v1
        with:
          plan-file: ${{ env.TF_WORKING_DIR }}/plan.json
          output-file: plan-visualization.html

      - name: Upload plan file (for apply job)
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/plan.tfplan
          retention-days: 5

      - name: Upload plan visualization
        uses: actions/upload-artifact@v4
        with:
          name: plan-visualization
          path: plan-visualization.html
          retention-days: 5

      - name: Comment plan summary on PR
        # if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🪄 **Terraform plan generated.**\n\nDownload the interactive visualization from the [workflow run artifacts](${runUrl}).`
            });

  # -----------------------------------------------------------------
  # 2. APPLY — only runs on main branch pushes, gated by a
  #    GitHub Environment that requires manual approval
  # -----------------------------------------------------------------
  apply:
    name: Terraform Apply
    needs: plan
    # if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production   # <-- configure this environment's "required reviewers" in repo Settings
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: terraform init -input=false

      - name: Download plan file
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      # - name: Terraform Apply
      #   working-directory: ${{ env.TF_WORKING_DIR }}
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #   run: terraform apply -input=false -auto-approve plan.tfplan